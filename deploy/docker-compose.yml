services:
  app:
    # 镜像地址在 .env 里配置，本文件无需修改
    image: ${LUMALOG_IMAGE}
    restart: unless-stopped
    environment:
      NUXT_ADMIN_USERNAME: ${NUXT_ADMIN_USERNAME}
      NUXT_ADMIN_PASSWORD: ${NUXT_ADMIN_PASSWORD}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD}
    volumes:
      - ./data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
